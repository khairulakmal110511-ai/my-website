<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOIR & THREAD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        h1, h2, h3 { font-family: 'Space Grotesk', sans-serif; }
        .grain {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }
        .product-card:hover img { transform: scale(1.05); }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .marquee-track { animation: marquee 20s linear infinite; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-white">

<div class="grain"></div>

<!-- Nav -->
<nav class="fixed w-full z-40 top-0 px-6 py-4 mix-blend-difference">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="text-2xl font-bold tracking-tighter" style="font-family: 'Space Grotesk'">NOIR<span class="text-neutral-500">&</span>THREAD</div>
        <button onclick="toggleCart()" class="relative">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"></path></svg>
            <span id="cart-count" class="absolute -top-1 -right-1 bg-white text-black text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span>
        </button>
    </div>
</nav>

<!-- Hero -->
<section class="min-h-screen flex items-center justify-center pt-20 px-6">
    <div class="max-w-7xl mx-auto grid md:grid-cols-2 gap-12 items-center">
        <div class="space-y-8">
            <div class="inline-block px-4 py-2 border border-neutral-700 rounded-full text-xs tracking-widest text-neutral-400">SS / 2026 COLLECTION</div>
            <h1 class="text-6xl md:text-8xl font-bold leading-none">REDEFINE<br><span class="text-neutral-500">YOUR STYLE</span></h1>
            <p class="text-neutral-400 text-lg max-w-md">Curated essentials for the modern wardrobe.</p>
            <button onclick="document.getElementById('shop').scrollIntoView({behavior: 'smooth'})" class="bg-white text-black px-8 py-4 rounded-full font-medium hover:bg-neutral-200">Shop Now</button>
        </div>
        <img src="https://images.unsplash.com/photo-1509631179647-0177331693ae?w=800&q=80" class="w-full h-[600px] object-cover rounded-2xl grayscale hidden md:block">
    </div>
</section>

<!-- Marquee -->
<div class="bg-white text-black py-4 overflow-hidden border-y border-neutral-800">
    <div class="marquee-track flex gap-8 whitespace-nowrap text-4xl font-bold" style="font-family: 'Space Grotesk'">
        <span>FREE SHIPPING</span><span>•</span><span>SUSTAINABLE</span><span>•</span><span>PREMIUM QUALITY</span><span>•</span>
        <span>FREE SHIPPING</span><span>•</span><span>SUSTAINABLE</span><span>•</span><span>PREMIUM QUALITY</span><span>•</span>
    </div>
</div>

<!-- Shop -->
<section id="shop" class="py-24 px-6 max-w-7xl mx-auto">
    <h2 class="text-4xl md:text-5xl font-bold mb-12 text-center">New Arrivals</h2>
    <div id="product-grid" class="grid md:grid-cols-2 lg:grid-cols-4 gap-6"></div>
</section>

<!-- Cart -->
<div id="cart-sidebar" class="fixed inset-y-0 right-0 w-96 bg-neutral-900 border-l border-neutral-800 transform translate-x-full transition-transform duration-500 z-50 flex flex-col">
    <div class="p-6 border-b border-neutral-800 flex justify-between items-center">
        <h3 class="text-xl font-bold">Cart (<span id="cart-count-header">0</span>)</h3>
        <button onclick="toggleCart()">✕</button>
    </div>
    <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
    <div class="p-6 border-t border-neutral-800">
        <div class="flex justify-between mb-4 text-lg font-bold"><span>Total</span><span id="cart-total">$0</span></div>
        <button onclick="checkout()" class="w-full bg-white text-black py-4 rounded-full font-bold">Checkout</button>
    </div>
</div>
<div id="overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/50 z-40 hidden"></div>

<!-- Toast -->
<div id="toast" class="fixed bottom-8 right-8 bg-white text-black px-6 py-4 rounded-2xl transform translate-y-24 transition-transform duration-300 z-50">Added to cart!</div>

<script>
const products = [
    { id: 1, name: "Wool Coat", price: 289, image: "https://images.unsplash.com/photo-1539533018447-63fcce2678e3?w=600&q=80" },
    { id: 2, name: "Blazer", price: 195, image: "https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=600&q=80" },
    { id: 3, name: "Linen Shirt", price: 125, image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=600&q=80" },
    { id: 4, name: "Knit Sweater", price: 145, image: "https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=600&q=80" },
    { id: 5, name: "Crossbody Bag", price: 220, image: "https://images.unsplash.com/photo-1548036328-c9fa89d128fa?w=600&q=80" },
    { id: 6, name: "Midi Dress", price: 340, image: "https://images.unsplash.com/photo-1595777457583-95e059d581b8?w=600&q=80" },
    { id: 7, name: "Trousers", price: 165, image: "https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=600&q=80" },
    { id: 8, name: "Watch", price: 189, image: "https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=600&q=80" }
];

let cart = [];

function renderProducts() {
    document.getElementById('product-grid').innerHTML = products.map(product => `
        <div class="product-card group bg-neutral-900 rounded-2xl overflow-hidden cursor-pointer" onclick="addToCart(${product.id})">
            <div class="h-80 overflow-hidden">
                <img src="${product.image}" class="w-full h-full object-cover transition-transform duration-500">
            </div>
            <div class="p-6">
                <h3 class="font-bold text-lg mb-2">${product.name}</h3>
                <div class="flex justify-between items-center">
                    <span class="text-xl font-bold">$${product.price}</span>
                    <button class="w-10 h-10 bg-neutral-800 rounded-full flex items-center justify-center hover:bg-white hover:text-black">+</button>
                </div>
            </div>
        </div>
    `).join('');
}

function addToCart(id) {
    const product = products.find(p => p.id === id);
    const item = cart.find(cartItem => cartItem.id === id);
    item ? item.quantity++ : cart.push({ ...product, quantity: 1 });
    updateCart();
    showToast();
}

function updateCart() {
    const count = cart.reduce((sum, item) => sum + item.quantity, 0);
    document.getElementById('cart-count').textContent = count;
    document.getElementById('cart-count-header').textContent = count;
    document.getElementById('cart-total').textContent = '$' + cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
    
    const items = document.getElementById('cart-items');
    if (cart.length === 0) {
        items.innerHTML = '<div class="text-center text-neutral-500 mt-12">Your cart is empty</div>';
    } else {
        items.innerHTML = cart.map(item => `
            <div class="flex gap-4 bg-neutral-800/50 p-4 rounded-xl">
                <img src="${item.image}" class="w-20 h-20 object-cover rounded-lg">
                <div class="flex-1">
                    <h4 class="font-bold text-sm">${item.name}</h4>
                    <p class="text-neutral-400 text-sm">$${item.price}</p>
                    <div class="flex items-center gap-2 mt-2">
                        <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-neutral-700 rounded">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-neutral-700 rounded">+</button>
                    </div>
                </div>
                <button onclick="removeFromCart(${item.id})">✕</button>
            </div>
        `).join('');
    }
}

function changeQty(id, delta) {
    const item = cart.find(cartItem => cartItem.id === id);
    if (!item) return;
    item.quantity += delta;
    if (item.quantity <= 0) removeFromCart(id);
    else updateCart();
}

function removeFromCart(id) {
    cart = cart.filter(cartItem => cartItem.id !== id);
    updateCart();
}

function toggleCart() {
    const sidebar = document.getElementById('cart-sidebar');
    const overlay = document.getElementById('overlay');
    if (sidebar.classList.contains('translate-x-full')) {
        sidebar.classList.remove('translate-x-full');
        overlay.classList.remove('hidden');
    } else {
        sidebar.classList.add('translate-x-full');
        overlay.classList.add('hidden');
    }
}

function showToast() {
    const toast = document.getElementById('toast');
    toast.classList.remove('translate-y-24');
    setTimeout(() => toast.classList.add('translate-y-24'), 2000);
}

function checkout() {
    if (cart.length === 0) return;
    alert('Thank you for your order! Total: $' + cart.reduce((sum, item) => sum + item.price * item.quantity, 0));
    cart = [];
    updateCart();
    toggleCart();
}

renderProducts();
updateCart();
</script>

</body>
</html>
